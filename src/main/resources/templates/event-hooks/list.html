<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout('Outgoing webhooks', ~{::pageContent})}">
    <div th:fragment="pageContent">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-send"></i> Outgoing webhooks</h2>
            <div class="d-flex gap-2">
                <a th:href="@{/system-settings}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to System settings
                </a>
                <a th:href="@{/admin/event-hooks/new}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add endpoint
                </a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(endpoints)}" class="card">
            <div class="card-body text-center py-4">
                <i class="bi bi-send-slash fs-1 text-secondary"></i>
                <p class="text-secondary mt-2">No endpoints configured. Signed event notifications
                    (workflow runs, review findings, issue assignments) will not be pushed anywhere.</p>
            </div>
        </div>

        <div th:if="${!#lists.isEmpty(endpoints)}" class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-group-divider">
                        <tr>
                            <th>Name</th>
                            <th>URL</th>
                            <th>Enabled</th>
                            <th>Event types</th>
                            <th>Scope</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="endpoint : ${endpoints}">
                            <td th:text="${endpoint.name}"></td>
                            <td><code th:text="${endpoint.url}"></code></td>
                            <td>
                                <span th:if="${endpoint.enabled}" class="badge bg-success">enabled</span>
                                <span th:if="${!endpoint.enabled}" class="badge bg-secondary">disabled</span>
                            </td>
                            <td>
                                <span th:each="type : ${endpoint.subscribedEventTypes()}"
                                      class="badge bg-secondary me-1" th:text="${type.wireValue()}"></span>
                            </td>
                            <td>
                                <span th:if="${endpoint.botId == null && endpoint.repoOwner == null && endpoint.repoName == null}"
                                      class="text-secondary">Global</span>
                                <span th:if="${endpoint.botId != null || endpoint.repoOwner != null || endpoint.repoName != null}">
                                    <span th:if="${endpoint.botId != null}" th:text="'bot #' + ${endpoint.botId}"></span>
                                    <span th:if="${endpoint.repoOwner != null}"
                                          th:text="${(endpoint.botId != null ? ' · ' : '') + endpoint.repoOwner + (endpoint.repoName != null ? '/' + endpoint.repoName : '')}"></span>
                                </span>
                            </td>
                            <td>
                                <div class="btn-group-with-gap btn-group-sm">
                                    <a th:href="@{/admin/event-hooks/{id}/deliveries(id=${endpoint.id})}"
                                       class="btn btn-outline-secondary">
                                        <i class="bi bi-list-check"></i> Deliveries
                                    </a>
                                    <a th:href="@{/admin/event-hooks/{id}/edit(id=${endpoint.id})}"
                                       class="btn btn-outline-primary">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <form th:action="@{/admin/event-hooks/{id}/toggle(id=${endpoint.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-warning btn-sm">
                                            <i class="bi bi-power"></i>
                                            <span th:text="${endpoint.enabled} ? 'Disable' : 'Enable'"></span>
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/event-hooks/{id}/delete(id=${endpoint.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Delete this endpoint? Its delivery history is deleted as well.');">
                                        <button type="submit" class="btn btn-outline-danger btn-sm">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
